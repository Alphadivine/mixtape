<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mixtape</title>
<meta name="description" content="Share songs with your crew, react, rate, and build a group playlist.">
<meta name="theme-color" content="#0f0d13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0d13; --surface:#18151e; --surface2:#221e2a; --line:#2f2a38;
  --text:#f3eef7; --muted:#a69fb2; --accent:#ff6b3d; --accent2:#ffc857; --good:#5fd38d; --bad:#ff5d6c;
  --radius:16px; --nav:68px; --player:0px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(var(--nav) + var(--player) + 20px + env(safe-area-inset-bottom))}
body.has-player{--player:64px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;margin:0}
.hidden{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
svg.i{width:18px;height:18px;flex:none}

/* Header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque";font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand svg{width:34px;height:34px}
.spacer{flex:1}
.icon-btn{height:38px;min-width:38px;padding:0 12px;border-radius:999px;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500}
.icon-btn:hover{background:var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface2);flex:none}
.avatar.sm{width:18px;height:18px}
.avatar.lg{width:56px;height:56px}
.avatar-btn{border-radius:50%;width:38px;height:38px;display:grid;place-items:center;background:var(--surface2)}

/* Toolbar */
.toolbar{padding:14px 0 6px;display:flex;flex-direction:column;gap:10px}
.search{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;outline:none}
.search:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.mtag.on{background:var(--accent2);border-color:var(--accent2);color:#1d1404}
.playall{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));text-align:left;margin:6px 0 4px}
.playall .pi{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#1a0d07;display:grid;place-items:center;flex:none}
.playall .pi svg{width:15px;height:15px}
.playall b{display:block;font-size:15px}
.playall span{font-size:12px;color:var(--muted)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 8px}
.section-title h2{font-size:20px}
.section-title span{color:var(--muted);font-size:14px}
.divider{display:flex;align-items:center;gap:10px;color:var(--accent2);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:4px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--accent2) 45%,transparent)}

/* Cards (slim) */
.list{display:flex;flex-direction:column;gap:10px;padding:6px 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:10px}
.card.unheard{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.card.playing{border-color:var(--accent2)}
.row{display:flex;gap:12px;align-items:center}
.art{position:relative;width:64px;height:64px;border-radius:11px;overflow:hidden;flex:none;background:var(--surface2)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.25);color:#fff}
.play span{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.7);display:grid;place-items:center}
.play svg{width:13px;height:13px}
.meta{min-width:0;flex:1;cursor:pointer}
.title{font-weight:700;font-size:16px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.by{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;margin-top:5px;flex-wrap:wrap;row-gap:4px}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--accent);color:#1a0d07}
.tag.gold{background:transparent;color:var(--accent2);padding:0;letter-spacing:0;font-size:12px;text-transform:none}
.moods{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.mood{font-size:11.5px;font-weight:600;color:var(--accent2);background:color-mix(in srgb,var(--accent2) 12%,transparent);padding:2px 8px;border-radius:999px}
.note{background:var(--surface2);border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.bar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;row-gap:8px}
.react{height:32px;min-width:34px;padding:0 6px;border-radius:999px;background:var(--surface2);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:3px;border:1px solid transparent}
.react b{font-size:11.5px;color:var(--muted);font-weight:700}
.react.mine{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 16%,var(--surface2))}
.stars{display:inline-flex;margin-left:auto;align-items:center}
.star{font-size:19px;line-height:1;color:var(--line);padding:2px 1px}
.star.on{color:var(--accent2)}
.bar2{display:flex;align-items:center;gap:5px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap;row-gap:8px}
.svc{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);flex:none}
.svc:hover{background:var(--line)}
.svc svg{width:18px;height:18px}
.ib{height:30px;min-width:30px;padding:0 8px;border-radius:999px;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.ib:hover{background:var(--line);color:var(--text)}
.ib svg{width:16px;height:16px}
.ib.ok{color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface2))}
.ib.queued{color:var(--accent2);background:color-mix(in srgb,var(--accent2) 14%,var(--surface2))}
.ib.add{color:var(--text)}
@media (max-width:359px){.ib .lbl{display:none}}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:38px;padding:0 14px;border-radius:10px;background:var(--surface2);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--accent);color:#1a0d07}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:color-mix(in srgb,var(--good) 18%,var(--surface2));color:var(--good)}
.btn.queued{background:color-mix(in srgb,var(--accent2) 16%,var(--surface2));color:var(--accent2)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.empty{text-align:center;color:var(--muted);padding:48px 16px;line-height:1.5}
.empty h3{color:var(--text);margin-bottom:6px;font-size:20px}

/* Crew */
.hl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.hl{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
.hl small{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.hl .who{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.hl .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl em{font-style:normal;color:var(--accent2);font-size:13px;font-weight:700}
.person-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.person-card:hover{border-color:var(--muted)}
.pill{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.hot{background:color-mix(in srgb,var(--good) 18%,var(--surface2));color:var(--good)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:"Bricolage Grotesque";font-size:22px}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600}
.mini{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--bg);border:1px solid var(--line);width:100%;text-align:left}
.mini img{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface2)}
.mini .r{margin-left:auto;color:var(--accent2);font-size:12px;font-weight:700;white-space:nowrap}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;height:var(--nav)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);font-weight:600;position:relative}
.tab.on{color:var(--text)}
.tab svg{width:22px;height:22px}
.badge{position:absolute;top:-4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#1a0d07;font-size:11px;font-weight:800;display:grid;place-items:center}
.fab{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#1a0d07;display:grid;place-items:center;box-shadow:0 8px 24px rgba(255,107,61,.35);margin:-22px 10px 0}
.fab svg{width:26px;height:26px}

/* Mini player */
#player{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));z-index:24;padding:0 8px 6px}
#player .pb{max-width:744px;margin:0 auto;height:58px;border-radius:14px;background:#2a2433;border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 8px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#player .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:var(--p,0%)}
#player img{width:42px;height:42px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface2)}
#player .title{font-size:14px}
#player .artist{font-size:12px}
.pbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none}
.pbtn:hover{background:rgba(255,255,255,.08)}
.pbtn.main{background:var(--text);color:var(--bg)}
.pbtn.on{color:var(--good)}
.pbtn svg{width:17px;height:17px}
.qpos{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h2{font-size:22px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.flabel{font-size:13px;color:var(--muted);font-weight:600}
.input,textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:11px 13px;outline:none}
.input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:70px;resize:vertical}
.hint{font-size:12px;color:var(--muted);line-height:1.45}
.results{display:flex;flex-direction:column;gap:6px;margin:6px 0 14px}
.result{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--bg);border:1px solid var(--line);text-align:left;width:100%}
.result img{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface2)}
.picked{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--bg);border:1px solid var(--accent);margin-bottom:14px}
.picked img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 4px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.person.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--bg))}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tagpick .chip{height:30px;font-size:12.5px}
.tagpick .custom{height:30px;width:120px;border-radius:999px;border:1px dashed var(--line);background:transparent;padding:0 12px;font-size:12.5px;outline:none}
.tagpick .custom:focus{border-color:var(--accent2)}
.check{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.detail-art{width:100%;max-width:260px;aspect-ratio:1;border-radius:18px;object-fit:cover;display:block;margin:0 auto 14px;background:var(--surface2)}
.links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.lnk{height:34px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;text-decoration:none;border:1px solid var(--line);background:var(--surface2)}
.lnk svg{width:16px;height:16px}
.whos{display:flex;flex-direction:column;gap:6px;margin:8px 0 10px}
.whos div{display:flex;align-items:center;gap:8px;font-size:14px}
.whos span.r{margin-left:auto;color:var(--accent2)}
.comment{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.comment:last-child{border-bottom:0}
.comment .body{flex:1;min-width:0;font-size:14px;line-height:1.45;word-break:break-word}
.comment .body b{font-size:13px}
.comment .time{color:var(--muted);font-size:12px;margin-left:6px}
.comment-form{display:flex;gap:8px;margin-top:10px}
.comment-form .input{flex:1}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.panel h3{font-size:16px;margin-bottom:8px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--surface2);padding:8px 10px;border-radius:8px;word-break:break-all;display:block;margin:6px 0}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)}

/* Guide + What's new */
.hbtn{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:17px;position:relative}
.hbtn:hover{background:var(--line)}
.hbtn .ndot{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.guide-intro{color:var(--muted);line-height:1.5;margin:0 0 12px;font-size:14px}
.guide-step{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.guide-step:last-child{border-bottom:0}
.guide-step .gi{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-size:18px;flex:none}
.guide-step .gt{font-size:14px;line-height:1.5}
.guide-step .gt b{color:var(--text)}
.wn{padding:12px 0;border-bottom:1px solid var(--line)}
.wn:last-child{border-bottom:0}
.wn h4{margin:0 0 2px;font-size:15px}
.wn .v{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:6px}
.wn ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.5}
.wn-older summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:700;padding:10px 0}

/* Gates */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.gate .box{max-width:420px}
.gate svg.logo{width:96px;height:96px;margin-bottom:12px}
.gate h1{font-size:44px;letter-spacing:-.03em}
.gate p{color:var(--muted);line-height:1.5;margin:10px 0 24px}
.gbtn{height:48px;padding:0 22px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:700;display:inline-flex;align-items:center;gap:10px}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--player) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;transition:.25s;max-width:calc(100% - 32px);width:max-content;display:flex;align-items:center;gap:14px;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast button{color:var(--accent);font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.04em;flex:none}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 64 64">
    <rect x="4" y="12" width="56" height="40" rx="7" fill="#ff6b3d"/>
    <rect x="11" y="18" width="42" height="17" rx="4" fill="#1a0d07"/>
    <circle cx="22" cy="26.5" r="5" fill="#ffc857"/><circle cx="42" cy="26.5" r="5" fill="#ffc857"/>
    <circle cx="22" cy="26.5" r="1.8" fill="#1a0d07"/><circle cx="42" cy="26.5" r="1.8" fill="#1a0d07"/>
    <path d="M17 52l4-9h22l4 9z" fill="#1a0d07" opacity=".35"/>
  </symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 5v14l10-7zM16 5h3v14h-3z" fill="currentColor"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>

/* ---------- Toast (with optional Undo) ---------- */
function toast(msg, ms = 2600, action){
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ""}`;
  if (action) t.querySelector("button").onclick = () => { t.classList.remove("show"); action.run(); };
  t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms);
}
/* Deferred actions: happen after a few seconds unless Undo is tapped. */
const pending = new Map();
function withUndo(key, msg, { apply, commit, revert }, ms = 5000){
  if (pending.has(key)) return;
  apply && apply();
  const timer = setTimeout(() => { pending.delete(key); commit(); }, ms);
  pending.set(key, { timer, commit });
  toast(msg, ms, { label:"Undo", run: () => {
    const p = pending.get(key); if (!p) return;
    clearTimeout(p.timer); pending.delete(key); revert && revert(); toast("Undone");
  }});
}
function flushPending(){ for (const [k,p] of pending) { clearTimeout(p.timer); pending.delete(k); p.commit(); } }
addEventListener("pagehide", flushPending);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushPending(); });

function timeAgo(ms){
  if (!ms) return "just now";
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return "just now";
  const m = Math.floor(s/60); if (m < 60) return m + "m ago";
  const h = Math.floor(m/60); if (h < 24) return h + "h ago";
  const d = Math.floor(h/24); if (d < 7) return d + "d ago";
  return new Date(ms).toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
const tsMs = t => t?.toMillis ? t.toMillis() : (typeof t === "number" ? t : Date.now());
const avatarUrl = (photo, name) => photo || `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#2f2a38"/><text x="20" y="26" font-family="sans-serif" font-size="18" font-weight="700" fill="#f3eef7" text-anchor="middle">${esc((name||"?").trim().charAt(0).toUpperCase())}</text></svg>`)}`;

/* ---------- State ---------- */
const S = { me:null, songs:[], users:{}, settings:{}, tab:"feed", filter:"all", tag:null, q:"", openId:null,
  since:0, loaded:false, hidden:new Set(), unpl:new Set(), hiddenComments:new Set(),
  queue:[], qi:0, playingId:null, paused:true, syncing:false, sharedText:null, reopenSettings:false };
const audio = new Audio();
audio.preload = "none";

let db, auth;
const configured = !Object.values(FIREBASE_CONFIG).some(v => String(v).startsWith("PASTE"));

/* ---------- Boot (called at the very bottom, once everything is defined) ---------- */
function boot(){
  const app = initializeApp(FIREBASE_CONFIG);
  auth = getAuth(app); db = getFirestore(app);
  spHandleCallback();
  readShareTarget();

  $("#signinBtn").onclick = async () => {
    const p = new GoogleAuthProvider();
    try { await signInWithPopup(auth, p); }
    catch (e) {
      if (["auth/popup-blocked","auth/operation-not-supported-in-this-environment"].includes(e.code)) signInWithRedirect(auth, p);
      else if (e.code !== "auth/popup-closed-by-user") toast("Sign-in failed: " + (e.code || e.message));
    }
  };

  let unsubs = [];
  onAuthStateChanged(auth, async user => {
    unsubs.forEach(u => u()); unsubs = [];
    if (!user) { S.me = null; $("#app").classList.add("hidden"); $("#signinGate").classList.remove("hidden"); return; }
    S.me = { uid:user.uid, name:user.displayName || (user.email||"").split("@")[0], photo:user.photoURL || "" };
    $("#signinGate").classList.add("hidden"); $("#app").classList.remove("hidden");
    $("#meAvatar").src = avatarUrl(S.me.photo, S.me.name);
    computeSince();
    setDoc(doc(db,"users",user.uid), { name:S.me.name, photo:S.me.photo, lastSeen:serverTimestamp() }, { merge:true }).catch(()=>{});

    unsubs.push(onSnapshot(query(collection(db,"songs"), orderBy("createdAt","desc")), snap => {
      S.songs = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      const first = !S.loaded; S.loaded = true;
      render(); if (S.openId) refreshDetail();
      if (first) setTimeout(() => spSync(), 1500);
    }, err => toast("Couldn't load songs: " + err.code)));
    unsubs.push(onSnapshot(collection(db,"users"), snap => {
      S.users = {}; snap.forEach(d => S.users[d.id] = d.data()); render();
    }));
    unsubs.push(onSnapshot(doc(db,"settings","group"), d => { S.settings = d.data() || {}; }));

    if (S.reopenSettings) setTimeout(() => { S.reopenSettings = false; openSettings(); }, 400);
    if (S.sharedText) setTimeout(() => { const t = S.sharedText; S.sharedText = null; openAdd(t); }, 300);
    $("#wnDot").classList.toggle("hidden", store.get("mx_seen_version") === APP_VERSION);
    setTimeout(maybeShowIntro, 900);
  });

  setInterval(() => spSync(), 5 * 60 * 1000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") spSync(); });
}

/* New-since-last-visit: a "visit" ends after 30 minutes away */
function computeSince(){
  const key = "mx_visit_" + S.me.uid, now = Date.now(), v = store.get(key);
  if (!v) S.since = 0;
  else if (now - v.last > 30 * 60 * 1000) S.since = v.last;
  else S.since = v.since || 0;
  const save = () => store.set(key, { since:S.since, last:Date.now() });
  save();
  clearInterval(computeSince._i); computeSince._i = setInterval(save, 60000);
  addEventListener("pagehide", save);
}

/* Android share target: Spotify → Share → Mixtape */
function readShareTarget(){
  const p = new URLSearchParams(location.search);
  if (!p.has("text") && !p.has("url") && !p.has("title")) return;
  const all = [p.get("url"), p.get("text"), p.get("title")].filter(Boolean).join(" ");
  S.sharedText = ((all.match(/https?:\/\/\S+/) || [all])[0] || "").trim();
  history.replaceState(null, "", redirectUri());
}

/* ---------- Helpers on songs ---------- */
const live = () => S.songs.filter(s => !S.hidden.has(s.id));
const ratingsFrom = (s, exclude) => Object.entries(s.ratings||{}).filter(([u]) => u !== exclude).map(([,v]) => v);
const avgRating = s => { const v = Object.values(s.ratings||{}); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : 0; };
const heard = (s, uid = S.me?.uid) => !!(s.listened||{})[uid];
const isInbox = s => (s.sentTo||[]).includes(S.me.uid);
const senderFor = s => { const sends = (s.sends||[]).filter(x => x.to === S.me.uid); return sends[sends.length-1]; };
const userName = uid => S.users[uid]?.name || "Someone";
const plState = s => S.unpl.has(s.id) ? "none" : (s.playlist || "none");
function links(s){
  const q = encodeURIComponent(`${s.title} ${s.artist}`);
  return {
    spotify: s.spotifyUrl || `https://open.spotify.com/search/${q}`,
    apple: s.appleUrl || `https://music.apple.com/us/search?term=${q}`,
    ytm: s.ytmUrl || `https://music.youtube.com/search?q=${q}`
  };
}
const songKey = s => `${s.title}|${String(s.artist).split(/,|&| feat\.| x /i)[0]}`.toLowerCase()
  .replace(/\(.*?\)|\[.*?\]|feat\..*$|- .*remaster.*$/g,"").replace(/[^a-z0-9|]/g,"");
const unheardPlayable = list => list.filter(s => !heard(s) && s.addedBy?.uid !== S.me.uid && s.previewUrl);

function filteredFeed(){
  let feed = live();
  const q = S.q.trim().toLowerCase();
  if (q) feed = feed.filter(s => `${s.title} ${s.artist} ${s.album} ${s.addedBy?.name} ${s.note} ${(s.tags||[]).join(" ")}`.toLowerCase().includes(q));
  if (S.tag) feed = feed.filter(s => (s.tags||[]).includes(S.tag));
  if (S.filter === "new") feed = feed.filter(s => !heard(s) && s.addedBy?.uid !== S.me.uid);
  if (S.filter === "mine") feed = feed.filter(s => s.addedBy?.uid === S.me.uid);
  if (S.filter === "playlist") feed = feed.filter(s => ["added","queued"].includes(plState(s)));
  if (S.filter === "top") feed = feed.filter(s => avgRating(s) > 0).sort((a,b) => avgRating(b) - avgRating(a));
  return feed;
}
const inboxSongs = () => live().filter(isInbox).sort((a,b) => (senderFor(b)?.at||0) - (senderFor(a)?.at||0));

/* ---------- Render ---------- */
function render(){
  if (!S.me) return;
  const songs = live();
  const unheardInbox = songs.filter(s => isInbox(s) && !heard(s)).length;
  const b = $("#inboxBadge"); b.textContent = unheardInbox; b.classList.toggle("hidden", !unheardInbox);

  // tag filter chips
  const tagCounts = {};
  songs.forEach(s => (s.tags||[]).forEach(t => tagCounts[t] = (tagCounts[t]||0) + 1));
  const tags = Object.keys(tagCounts).sort((a,b) => tagCounts[b] - tagCounts[a]);
  if (S.tag && !tagCounts[S.tag]) S.tag = null;
  const tf = $("#tagFilters");
  tf.classList.toggle("hidden", !tags.length);
  tf.innerHTML = tags.map(t => `<button class="chip mtag ${S.tag===t?"on":""}" data-tagf="${esc(t)}">#${esc(t)} <span style="opacity:.6">${tagCounts[t]}</span></button>`).join("");

  const feed = filteredFeed();
  // "new since your last visit" divider (time-ordered views only)
  let html = "";
  const showDivider = S.since && S.filter !== "top" && !S.q.trim();
  let dividerDone = !showDivider;
  const newCount = showDivider ? feed.filter(s => tsMs(s.createdAt) > S.since && s.addedBy?.uid !== S.me.uid).length : 0;
  feed.forEach((s, i) => {
    if (!dividerDone && tsMs(s.createdAt) <= S.since) {
      dividerDone = true;
      if (i > 0 && newCount) html += `<div class="divider">↑ ${newCount} new since your last visit</div>`;
    }
    html += card(s);
  });
  $("#feedList").innerHTML = feed.length ? html : emptyFeed();

  const up = unheardPlayable(feed);
  $("#feedPlay").innerHTML = up.length ? playAllBtn("feed", up.length, "Play all new") : "";

  const inbox = inboxSongs();
  $("#inboxCount").textContent = unheardInbox ? `${unheardInbox} new` : "";
  const ip = unheardPlayable(inbox);
  $("#inboxPlay").innerHTML = ip.length ? playAllBtn("inbox", ip.length, "Play your inbox") : "";
  $("#inboxList").innerHTML = inbox.length ? inbox.map(s => card(s, true)).join("")
    : `<div class="empty"><h3>Nothing here yet</h3>When a friend sends you a song, it lands here.</div>`;

  if (S.tab === "crew") renderCrew();
  renderPlayer();
}
function playAllBtn(src, n, label){
  return `<button class="playall" data-action="playall" data-src="${src}"><span class="pi">${ico("play")}</span>
    <span style="flex:1"><b>${label}</b><span>${n} preview${n>1?"s":""} you haven't heard · 30s each</span></span></button>`;
}
function emptyFeed(){
  if (live().length) return `<div class="empty"><h3>No matches</h3>Try a different filter, tag or search.</div>`;
  return `<div class="empty"><h3>The tape's blank</h3>Tap <b>+</b> to share the first song with the crew.</div>`;
}

function card(s, inboxView = false){
  const me = S.me.uid, mine = s.addedBy?.uid === me;
  const myReact = (s.reactions||{})[me], myRate = (s.ratings||{})[me] || 0;
  const counts = {}; Object.values(s.reactions||{}).forEach(r => counts[r] = (counts[r]||0)+1);
  const avg = avgRating(s), nRates = Object.keys(s.ratings||{}).length;
  const heardCount = Object.keys(s.listened||{}).length;
  const L = links(s);
  const sender = inboxView ? senderFor(s) : null;
  const unheard = !heard(s) && !mine;
  const isCur = S.playingId === s.id, isPlaying = isCur && !S.paused;

  return `<article class="card ${unheard && isInbox(s) ? "unheard" : ""} ${isCur ? "playing" : ""}">
    <div class="row">
      <div class="art">
        ${s.artwork ? `<img src="${esc(s.artwork)}" alt="" loading="lazy">` : ""}
        ${s.previewUrl ? `<button class="play" data-action="preview" data-id="${s.id}" title="${isPlaying?"Pause":"Play"} 30s preview"><span>${ico(isPlaying?"pause":"play")}</span></button>` : ""}
      </div>
      <div class="meta" data-action="detail" data-id="${s.id}">
        <div class="title">${esc(s.title)}</div>
        <div class="artist">${esc(s.artist)}${s.album ? " · " + esc(s.album) : ""}</div>
        <div class="by">
          <img class="avatar sm" src="${esc(avatarUrl(s.addedBy?.photo, s.addedBy?.name))}" alt="">
          <span>${sender ? `Sent by <b>${esc(sender.fromName)}</b> · ${timeAgo(sender.at)}` : `${s.source==="spotify" ? "From the playlist" : esc(s.addedBy?.name)} · ${timeAgo(tsMs(s.createdAt))}`}</span>
          ${unheard && isInbox(s) && !inboxView ? `<span class="tag">For you</span>` : ""}
          ${nRates ? `<span class="tag gold">★ ${avg.toFixed(1)} <span style="color:var(--muted)">(${nRates})</span></span>` : ""}
          ${heardCount ? `<span title="Listened by ${heardCount}">🎧 ${heardCount}</span>` : ""}
        </div>
        ${(s.tags||[]).length ? `<div class="moods">${s.tags.map(t => `<span class="mood">#${esc(t)}</span>`).join("")}</div>` : ""}
      </div>
    </div>
    ${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}
    <div class="bar">
      ${REACTIONS.map(r => `<button class="react ${myReact===r?"mine":""}" data-action="react" data-id="${s.id}" data-r="${r}">${r}${counts[r]?`<b>${counts[r]}</b>`:""}</button>`).join("")}
      <span class="stars" title="Your rating">
        ${[1,2,3,4,5].map(n => `<button class="star ${n<=myRate?"on":""}" data-action="rate" data-id="${s.id}" data-n="${n}" aria-label="Rate ${n}">★</button>`).join("")}
      </span>
    </div>
    <div class="bar2">
      <a class="svc" href="${esc(L.spotify)}" target="_blank" rel="noopener" title="Open in Spotify">${ico("sp")}</a>

/* ---------- Crew stats ---------- */
function crewStats(){
  const songs = live(), out = {};
  for (const [uid,u] of Object.entries(S.users)) {
    const shared = songs.filter(s => s.addedBy?.uid === uid && s.source !== "spotify");
    const recv = shared.flatMap(s => ratingsFrom(s, uid));
    const fire = shared.reduce((n,s) => n + Object.entries(s.reactions||{}).filter(([r,v]) => r !== uid && v === "🔥").length, 0);
    const avgOf = x => { const r = ratingsFrom(x, uid); return r.length ? r.reduce((p,c)=>p+c,0)/r.length : 0; };
    const top = shared.filter(s => ratingsFrom(s, uid).length).sort((a,b) => avgOf(b) - avgOf(a) || ratingsFrom(b,uid).length - ratingsFrom(a,uid).length)[0];
    out[uid] = {
      uid, name:u.name, photo:u.photo, shared:shared.length,
      avg: recv.length ? recv.reduce((a,b)=>a+b,0)/recv.length : 0, nRecv: recv.length,
      fire, top,
      inPlaylist: shared.filter(s => plState(s) === "added").length,
      listened: songs.filter(s => (s.listened||{})[uid]).length,
      given: songs.filter(s => (s.ratings||{})[uid]).length,
      match: tasteMatch(uid)
    };
  }
  return out;
}
function tasteMatch(uid){
  if (uid === S.me.uid) return null;
  const both = live().filter(s => (s.ratings||{})[uid] && (s.ratings||{})[S.me.uid]);
  if (both.length < 2) return { pct:null, n:both.length };
  const diff = both.reduce((a,s) => a + Math.abs(s.ratings[uid] - s.ratings[S.me.uid]), 0) / both.length;
  return { pct: Math.round(100 - diff * 25), n: both.length };
}
function renderCrew(){
  const st = crewStats(), people = Object.values(st);
  $("#crewCount").textContent = `${people.length} ${people.length === 1 ? "person" : "people"}`;
  if (!people.length) { $("#crewBody").innerHTML = ""; return; }
  const best = (key, filt = () => true) => people.filter(p => p[key] > 0 && filt(p)).sort((a,b) => b[key] - a[key])[0];
  const hl = [
    ["Most shared", best("shared"), p => `${p.shared} song${p.shared>1?"s":""}`],
    ["Best taste", best("avg", p => p.nRecv >= 3), p => `★ ${p.avg.toFixed(1)} avg from the crew`],
    ["Most 🔥", best("fire"), p => `${p.fire} 🔥 on their picks`],
    ["Top listener", best("listened"), p => `${p.listened} song${p.listened>1?"s":""} listened`]
  ];
  const tiles = hl.map(([label, p, fmt]) => `<button class="hl" ${p ? `data-action="person" data-uid="${p.uid}"` : ""}><small>${label}</small>
    ${p ? `<div class="who"><img class="avatar" src="${esc(avatarUrl(p.photo,p.name))}" alt=""><span>${esc(p.name)}</span></div><em>${fmt(p)}</em>`
        : `<div class="hint">Not enough activity yet</div>`}</button>`).join("");
  const list = people.sort((a,b) => (b.uid===S.me.uid) - (a.uid===S.me.uid) || b.shared - a.shared).map(p => `
    <button class="person-card" data-action="person" data-uid="${p.uid}">
      <img class="avatar lg" src="${esc(avatarUrl(p.photo,p.name))}" alt="">
      <div class="meta"><div class="title">${esc(p.name)}${p.uid===S.me.uid ? ` <span class="hint">(you)</span>` : ""}</div>
        <div class="artist">${p.shared} shared${p.nRecv ? ` · ★ ${p.avg.toFixed(1)}` : ""}${p.fire ? ` · 🔥 ${p.fire}` : ""} · ${p.inPlaylist} in playlist</div></div>
      ${p.match ? (p.match.pct != null ? `<span class="pill ${p.match.pct >= 75 ? "hot" : ""}">${p.match.pct}% match</span>` : `<span class="pill">match: rate more</span>`) : ""}
    </button>`).join("");
  $("#crewBody").innerHTML = `<div class="hl-grid">${tiles}</div><div class="list">${list}</div>`;
}
function openPerson(uid){
  const p = crewStats()[uid]; if (!p) return;
  const theirs = live().filter(s => s.addedBy?.uid === uid && s.source !== "spotify");
  const m = p.match;
  openSheet(`${head(esc(p.name))}
    <div class="row" style="margin-bottom:14px"><img class="avatar lg" src="${esc(avatarUrl(p.photo,p.name))}" alt="">
      <div class="meta" style="cursor:default"><div class="title">${esc(p.name)}</div>
      <div class="hint">${m ? (m.pct != null ? `<b style="color:var(--good)">${m.pct}% taste match</b> with you, from ${m.n} songs you've both rated` : `Rate ${2 - m.n} more song${2-m.n>1?"s":""} you've both rated to see your taste match`) : "This is you"}</div></div></div>
    <div class="stat-grid">
      <div class="stat"><b>${p.shared}</b><span>Shared</span></div>
      <div class="stat"><b>${p.nRecv ? p.avg.toFixed(1) : "–"}</b><span>Avg ★ received</span></div>
      <div class="stat"><b>${p.fire}</b><span>🔥 received</span></div>
      <div class="stat"><b>${p.inPlaylist}</b><span>In playlist</span></div>
      <div class="stat"><b>${p.listened}</b><span>Listened</span></div>
      <div class="stat"><b>${p.given}</b><span>Ratings given</span></div>
    </div>
    ${p.top ? `<div class="flabel" style="margin-bottom:6px">Top pick</div>${miniRow(p.top, uid)}<div style="height:14px"></div>` : ""}
    <div class="flabel" style="margin-bottom:6px">Shared by ${esc(p.name)} (${theirs.length})</div>
    <div class="list" style="padding:0">${theirs.length ? theirs.map(s => miniRow(s, uid)).join("") : `<div class="hint">Nothing shared yet.</div>`}</div>`);
}
function miniRow(s, ownerUid){
  const r = ratingsFrom(s, ownerUid), a = r.length ? (r.reduce((x,y)=>x+y,0)/r.length).toFixed(1) : null;
  return `<button class="mini" data-action="detail" data-id="${s.id}"><img src="${esc(s.artwork)}" alt="">
    <div class="meta"><div class="title" style="font-size:14px">${esc(s.title)}</div><div class="artist">${esc(s.artist)}</div></div>
    ${a ? `<span class="r">★ ${a}</span>` : ""}</button>`;
}

/* ---------- Mini player ---------- */
function playQueue(list, startId){
  S.queue = list.map(s => s.id);
  S.qi = Math.max(0, startId ? S.queue.indexOf(startId) : 0);
  playCurrent();
}
function playCurrent(){
  const s = S.songs.find(x => x.id === S.queue[S.qi]);
  if (!s) return stopPlayer();
  S.playingId = s.id; S.paused = false;
  audio.src = s.previewUrl;
  audio.play().catch(() => { S.paused = true; toast("Preview couldn't play"); render(); });
  if ("mediaSession" in navigator && window.MediaMetadata) {
    navigator.mediaSession.metadata = new MediaMetadata({ title:s.title, artist:s.artist, album:"Mixtape", artwork: s.artwork ? [{ src:s.artwork, sizes:"600x600", type:"image/jpeg" }] : [] });
  }
  render();
}
function togglePause(){
  if (!S.playingId) return;
  if (audio.paused) { audio.play().catch(()=>{}); S.paused = false; } else { audio.pause(); S.paused = true; }
  render();
}
function nextTrack(){ if (S.qi < S.queue.length - 1) { S.qi++; playCurrent(); } else stopPlayer(); }
function stopPlayer(){ audio.pause(); audio.removeAttribute("src"); S.playingId = null; S.paused = true; S.queue = []; render(); }
audio.addEventListener("ended", () => { if (S.qi < S.queue.length - 1) nextTrack(); else { S.paused = true; render(); } });
audio.addEventListener("timeupdate", () => {
  const pb = $("#player .pb"); if (pb && audio.duration) pb.style.setProperty("--p", (audio.currentTime / audio.duration * 100) + "%");
});
if ("mediaSession" in navigator) {
  try {
    navigator.mediaSession.setActionHandler("play", togglePause);
    navigator.mediaSession.setActionHandler("pause", togglePause);
    navigator.mediaSession.setActionHandler("nexttrack", nextTrack);
  } catch {}
}
function renderPlayer(){
  const el = $("#player"), s = S.songs.find(x => x.id === S.playingId);
  document.body.classList.toggle("has-player", !!s);
  if (!s) { el.classList.add("hidden"); el.innerHTML = ""; return; }
  el.classList.remove("hidden");
  const mine = s.addedBy?.uid === S.me.uid;
  el.innerHTML = `<div class="pb">
    <img src="${esc(s.artwork)}" alt="">
    <div class="meta" data-action="detail" data-id="${s.id}"><div class="title">${esc(s.title)}</div>
      <div class="artist">${esc(s.artist)}${S.queue.length > 1 ? ` · <span class="qpos">${S.qi+1}/${S.queue.length}</span>` : ""}</div></div>
    ${mine ? "" : `<button class="pbtn ${heard(s)?"on":""}" data-action="heard" data-id="${s.id}" title="${heard(s)?"Listened":"Mark listened"}">${ico("check")}</button>`}
    <button class="pbtn main" data-action="pp" title="${S.paused?"Play":"Pause"}">${ico(S.paused?"play":"pause")}</button>
    ${S.qi < S.queue.length - 1 ? `<button class="pbtn" data-action="next" title="Next">${ico("next")}</button>` : ""}
    <button class="pbtn" data-action="stop" title="Close">${ico("x")}</button>
    <div class="prog"></div></div>`;
  if (audio.duration) el.querySelector(".pb").style.setProperty("--p", (audio.currentTime / audio.duration * 100) + "%");
}

/* ---------- Events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-action],[data-tab],[data-filter],[data-tagf]");
  if (!t) return;
  if (t.dataset.tab) return switchTab(t.dataset.tab);
  if (t.dataset.filter) { S.filter = t.dataset.filter;
    document.querySelectorAll("#filters .chip").forEach(x => x.classList.toggle("on", x === t)); render(); return; }
  if (t.dataset.tagf) { S.tag = S.tag === t.dataset.tagf ? null : t.dataset.tagf; render(); return; }

  const id = t.dataset.id, s = S.songs.find(x => x.id === id);
  switch (t.dataset.action) {
    case "add": return openAdd();
    case "settings": return openSettings();
    case "help": return openHelp();
    case "whatsnew": return openWhatsNew();
    case "person": return openPerson(t.dataset.uid);
    case "open-playlist":
      if (S.settings.playlistUrl) window.open(S.settings.playlistUrl, "_blank", "noopener");
      else { toast("No group playlist yet. Add one in Settings."); openSettings(); }
      return;
    case "preview":
      if (S.playingId === id) { togglePause(); return refreshDetail(); }
      playQueue([s]); return refreshDetail();
    case "playall": {
      const up = unheardPlayable(t.dataset.src === "inbox" ? inboxSongs() : filteredFeed());
      if (!up.length) return toast("Nothing new with a preview");
      return playQueue(up);
    }
    case "pp": return togglePause();
    case "next": return nextTrack();
    case "stop": return stopPlayer();
    case "detail": return openDetail(id);
    case "send": return openSend(s);
    case "react": {
      const mine = (s.reactions||{})[S.me.uid] === t.dataset.r;
      return update(id, { [`reactions.${S.me.uid}`]: mine ? deleteField() : t.dataset.r });
    }
    case "rate": {
      const n = +t.dataset.n, cur = (s.ratings||{})[S.me.uid];
      return update(id, { [`ratings.${S.me.uid}`]: cur === n ? deleteField() : n });
    }
    case "heard": return update(id, { [`listened.${S.me.uid}`]: heard(s) ? deleteField() : true });
    case "playlist": return playlistAction([s], t);
    case "unplaylist": return unplaylistWithUndo(s);
  }
});
function switchTab(tab){
  S.tab = tab;
  document.querySelectorAll(".tab[data-tab]").forEach(x => x.classList.toggle("on", x.dataset.tab === tab));
  for (const v of ["feed","crew","inbox"]) $("#view-" + v).classList.toggle("hidden", v !== tab);
  if (tab === "crew") renderCrew();
  window.scrollTo({ top:0 });
}
$("#search").addEventListener("input", e => { S.q = e.target.value; render(); });

async function update(id, data){
  try { await updateDoc(doc(db,"songs",id), data); return true; }
  catch (e) { toast("Couldn't save: " + (e.code || e.message)); return false; }
}

/* Mood tag picker: presets + tags the crew already uses + your own */
function tagPicker(root, initial = []){
  let sel = [...initial];
  const used = new Set(live().flatMap(s => s.tags||[]));
  const clean = v => v.trim().toLowerCase().replace(/^#/, "").replace(/\s+/g, " ").slice(0, 20);
  const draw = () => {
    const pool = [...new Set([...MOODS, ...used, ...sel])];
    root.innerHTML = `<div class="tagpick">${pool.map(t => `<button type="button" class="chip mtag ${sel.includes(t)?"on":""}" data-t="${esc(t)}">#${esc(t)}</button>`).join("")}
      <input class="custom" maxlength="20" placeholder="+ your own"></div>`;
    root.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
      const t = b.dataset.t;
      if (sel.includes(t)) sel = sel.filter(x => x !== t);
      else if (sel.length >= MAX_TAGS) return toast(`Up to ${MAX_TAGS} tags`);
      else sel.push(t);
      draw();
    });
    const inp = root.querySelector(".custom");
    inp.onkeydown = e => {
      if (e.key !== "Enter") return; e.preventDefault();
      const t = clean(inp.value); if (!t) return;
      if (!sel.includes(t) && sel.length >= MAX_TAGS) return toast(`Up to ${MAX_TAGS} tags`);
      if (!sel.includes(t)) sel.push(t);
      used.add(t); draw(); root.querySelector(".custom").focus();
    };
  };
  draw();
  return () => {
    const extra = clean(root.querySelector(".custom")?.value || "");
    if (extra && !sel.includes(extra) && sel.length < MAX_TAGS) sel.push(extra);
    return sel;
  };
}

/* ---------- Lookups ---------- */
function jsonp(url, ms = 8000){
  return new Promise((resolve, reject) => {
    const cb = "mx_cb_" + Math.random().toString(36).slice(2);
    const sc = document.createElement("script");
    const done = () => { delete window[cb]; sc.remove(); clearTimeout(t); };
    const t = setTimeout(() => { done(); reject(new Error("timeout")); }, ms);
    window[cb] = d => { done(); resolve(d); };
    sc.onerror = () => { done(); reject(new Error("network")); };
    sc.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
    document.head.appendChild(sc);
  });
}
async function itunesSearch(term, limit = 8){
  const d = await jsonp(`https://itunes.apple.com/search?media=music&entity=song&limit=${limit}&term=${encodeURIComponent(term)}`);
  return (d.results||[]).map(r => ({
    title: r.trackName, artist: r.artistName, album: r.collectionName || "",
    artwork: (r.artworkUrl100||"").replace("100x100bb","600x600bb"),
    previewUrl: r.previewUrl || "", appleUrl: r.trackViewUrl || "",
    year: (r.releaseDate||"").slice(0,4), genre: r.primaryGenreName || ""
  }));
}
async function odesli(url){
  const r = await fetch(`https://api.song.link/v1-alpha.1/links?userCountry=US&url=${encodeURIComponent(url)}`);
  if (!r.ok) throw new Error("songlink " + r.status);
  return r.json();
}
function fromOdesli(d){
  const lp = d.linksByPlatform || {};
  return {
    spotifyUrl: lp.spotify?.url || "", spotifyId: (lp.spotify?.entityUniqueId || "").split("::")[1] || "",
    appleUrl: lp.appleMusic?.url || "", ytmUrl: lp.youtubeMusic?.url || "",
    songLink: d.pageUrl || ""
  };
}
async function lookupLink(url){
  const d = await odesli(url);
  const ent = d.entitiesByUniqueId?.[d.entityUniqueId];
  if (!ent) return [];
  let base = { title:ent.title, artist:ent.artistName, album:"", artwork:ent.thumbnailUrl||"", previewUrl:"", year:"", genre:"" };
  try {
    const m = (await itunesSearch(`${ent.title} ${ent.artistName}`, 1))[0];
    if (m && songKey(m) === songKey(base)) base = { ...base, album:m.album, artwork:m.artwork||base.artwork, previewUrl:m.previewUrl, year:m.year, genre:m.genre };
  } catch {}
  return [{ ...base, ...fromOdesli(d), _resolved:true }];
}
async function enrich(it){
  const out = { ...it }; delete out._resolved;
  if (!it._resolved && it.appleUrl) {
    try { Object.assign(out, fromOdesli(await odesli(it.appleUrl)), { appleUrl: it.appleUrl }); } catch {}
  }
  for (const k of ["spotifyUrl","spotifyId","ytmUrl","songLink","appleUrl"]) out[k] = out[k] || "";
  return out;
}

const spConnected = () => !!store.get("mx_sp_tok")?.refresh;
// Connections made before playlist sync existed lack the read permission
const spNeedsReconnect = () => spConnected() && !/playlist-read/.test(store.get("mx_sp_tok")?.scope || "");
const spLast = () => store.get("mx_sp_last");
function spSetLast(ok, msg){
  store.set("mx_sp_last", { ok, msg, at: Date.now() });
  if (!ok) console.warn("[Mixtape] Spotify:", msg);
  if ($("#spDetails")) openSettings();
}
const SP_ERRORS = {
  access_denied: "You (or Spotify) declined the connection. If you didn't tap Cancel, make sure your Spotify email is added under User Management in the Spotify developer dashboard.",
  invalid_scope: "Spotify rejected the permissions Mixtape asked for.",
  unsupported_response_type: "Spotify rejected the sign-in request type."
};
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");

async function spConnect(){
  const cid = S.settings.spotifyClientId;
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const state = b64url(crypto.getRandomValues(new Uint8Array(12)));
  store.set("mx_sp_pkce", { verifier, state, cid });
  location.href = "https://accounts.spotify.com/authorize?" + new URLSearchParams({
    client_id: cid, response_type: "code", redirect_uri: redirectUri(),
    code_challenge_method: "S256", code_challenge: challenge, scope: SP_SCOPES, state
  });
}
async function spHandleCallback(){
  const p = new URLSearchParams(location.search);
  if (!p.has("code") && !p.has("error")) return;
  const pk = store.get("mx_sp_pkce"); store.del("mx_sp_pkce");
  history.replaceState(null, "", redirectUri());
  S.reopenSettings = true;
  if (p.get("error")) { spSetLast(false, "Spotify said: " + (SP_ERRORS[p.get("error")] || p.get("error"))); return; }
  if (!pk || pk.state !== p.get("state")) { spSetLast(false, "The connection got lost on the way back from Spotify (it may have opened in a different tab or browser). Tap Connect Spotify again."); return; }
  try {
    const r = await fetch("https://accounts.spotify.com/api/token", { method:"POST",
      headers:{ "Content-Type":"application/x-www-form-urlencoded" },
      body: new URLSearchParams({ grant_type:"authorization_code", code:p.get("code"), redirect_uri:redirectUri(), client_id:pk.cid, code_verifier:pk.verifier }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error_description || d.error);
    store.set("mx_sp_tok", { access:d.access_token, refresh:d.refresh_token, exp:Date.now() + d.expires_in*1000, cid:pk.cid, scope:d.scope || SP_SCOPES });
    spSetLast(true, "Spotify connected 🎧 + Playlist now adds songs instantly on this device.");
    toast("Spotify connected 🎧"); render();
    setTimeout(() => spSync(true), 2000);
  } catch (e) {
    const m = String(e.message || e);
    spSetLast(false, "Spotify said no: " + m + (/redirect/i.test(m) ? ` (the Redirect URI in the Spotify dashboard must be exactly ${redirectUri()})` : ""));
  }
}
async function spToken(force = false){
  const t = store.get("mx_sp_tok"); if (!t) return null;
  if (!force && Date.now() < t.exp - 60000) return t.access;
  const r = await fetch("https://accounts.spotify.com/api/token", { method:"POST",
    headers:{ "Content-Type":"application/x-www-form-urlencoded" },
    body: new URLSearchParams({ grant_type:"refresh_token", refresh_token:t.refresh, client_id:t.cid }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { store.del("mx_sp_tok"); spSetLast(false, "Your Spotify connection expired. Tap Connect Spotify to reconnect."); render(); throw new Error("Spotify login expired. Reconnect in Settings."); }
  store.set("mx_sp_tok", { ...t, access:d.access_token, refresh:d.refresh_token || t.refresh, exp:Date.now() + d.expires_in*1000, scope:d.scope || t.scope });
  return d.access_token;
}
async function spFetch(path, opts = {}, retry = true){
  const tok = await spToken();
  const r = await fetch("https://api.spotify.com/v1" + path, { ...opts, headers:{ ...(opts.headers||{}), Authorization:"Bearer " + tok, "Content-Type":"application/json" } });
  if (r.status === 401 && retry) { await spToken(true); return spFetch(path, opts, false); }
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    const msg = r.status === 403 ? "Spotify blocked it. Make sure the playlist is collaborative and you're on the app's user list."
      : r.status === 429 ? "Spotify's rate limit hit. Try again in a minute."
      : (d.error?.message || "Spotify error " + r.status);
    const err = new Error(msg); err.status = r.status; throw err;
  }
  return r.status === 204 ? null : r.json().catch(() => null);
}
async function spFindId(s){
  if (s.spotifyId) return s.spotifyId;
  const clean = x => String(x).replace(/\(.*?\)|\[.*?\]|"/g, "").trim();
  const d = await spFetch(`/search?type=track&limit=1&q=${encodeURIComponent(`track:${clean(s.title)} artist:${clean(String(s.artist).split(",")[0])}`)}`);
  const id = d?.tracks?.items?.[0]?.id;
  if (id) update(s.id, { spotifyId:id, spotifyUrl: s.spotifyUrl || `https://open.spotify.com/track/${id}` });
  return id;
}
async function playlistRemove(s, btn, quiet = false){
  if (!spConnected() || !S.settings.playlistId) { toast("Connect Spotify in Settings to remove songs from the playlist"); return false; }
  const label = btn?.innerHTML; if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Removing…`; }
  try {
    const id = await spFindId(s);
    if (!id) throw new Error(`Couldn't find "${s.title}" on Spotify`);
    await spFetch(`/playlists/${S.settings.playlistId}/items`, { method:"DELETE", body: JSON.stringify({ items: [{ uri: "spotify:track:" + id }] }) });
    await update(s.id, { playlist:"none", playlistBy:S.me.uid, playlistAt:Date.now() });
    if (!quiet) toast("Removed from the playlist");
    return true;
  } catch (e) { toast(e.message, 5000); return false; }
  finally { if (btn && document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = label; } }
}
async function playlistAction(songs, btn){
  if (!spConnected() || !S.settings.playlistId) {
    const fresh = songs.filter(s => s.playlist !== "queued");
    await Promise.all(fresh.map(s => update(s.id, { playlist:"queued", playlistBy:S.me.uid, playlistAt:Date.now() })));
    if (!S.settings.playlistId) return toast("Queued. Add a group playlist in Settings to send it over.");
    return toast(fresh.length ? "Queued for the playlist. Someone connected to Spotify can add it." : "Already queued");
  }
  const label = btn?.innerHTML; if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spin"></span>`; }
  try {
    const found = [], missing = [];
    for (const s of songs) { const id = await spFindId(s); id ? found.push({ s, id }) : missing.push(s); }
    for (let i = 0; i < found.length; i += 100) {
      await spFetch(`/playlists/${S.settings.playlistId}/items`, { method:"POST", body: JSON.stringify({ uris: found.slice(i, i+100).map(x => "spotify:track:" + x.id) }) });
    }
    await Promise.all(found.map(x => update(x.s.id, { playlist:"added", playlistBy:S.me.uid, playlistAt:Date.now() })));
    toast(missing.length ? `Added ${found.length}. Couldn't find "${missing[0].title}" on Spotify.` : `Added to the playlist 🎉`, 4000);
  } catch (e) { toast(e.message, 5000); }
  finally { if (btn && document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = label; } }
}

/* Two-way sync: read the Spotify playlist and line Mixtape up with it */
async function spSync(manual = false){
  if (!S.me || !S.loaded || !spConnected() || spNeedsReconnect() || !S.settings.playlistId || S.syncing) return;
  if (!manual && Date.now() - (store.get("mx_sync_at") || 0) < 2 * 60 * 1000) return;
  S.syncing = true;
  try {
    const tracks = [];
    let path = `/playlists/${S.settings.playlistId}/items?limit=50`;
    for (let guard = 0; path && guard < 40; guard++) {
      const d = await spFetch(path);
      for (const x of d?.items || []) {
        const t = x.item || x.track;
        if (t && t.id && (t.type || "track") === "track") tracks.push(t);
      }
      path = d?.next ? d.next.replace("https://api.spotify.com/v1", "") : null;
    }
    store.set("mx_sync_at", Date.now());
    const keyOf = t => songKey({ title:t.name, artist:t.artists?.[0]?.name || "" });
    const ids = new Set(tracks.map(t => t.id)), keys = new Set(tracks.map(keyOf));
    const songs = live(), recent = s => Date.now() - (s.playlistAt || 0) < 90 * 1000;
    let unmarked = 0, marked = 0, imported = 0;
    for (const s of songs) {
      if (recent(s) || S.unpl.has(s.id)) continue;
      const inSp = (s.spotifyId && ids.has(s.spotifyId)) || keys.has(songKey(s));
      if (s.playlist === "added" && !inSp) { if (await update(s.id, { playlist:"none", playlistAt:Date.now() })) unmarked++; }
      else if (s.playlist !== "added" && inSp) { if (await update(s.id, { playlist:"added", playlistAt:Date.now() })) marked++; }
    }
    const knownIds = new Set(songs.map(s => s.spotifyId).filter(Boolean)), knownKeys = new Set(songs.map(songKey));
    const fresh = tracks.filter(t => !knownIds.has(t.id) && !knownKeys.has(keyOf(t)));
    for (const t of fresh.slice(0, 25)) {
      const base = {
        title:t.name, artist:(t.artists||[]).map(a => a.name).join(", "), album:t.album?.name || "",
        artwork:t.album?.images?.[0]?.url || "", year:(t.album?.release_date || "").slice(0,4), genre:"",
        previewUrl:"", appleUrl:"", ytmUrl:"", songLink:"",
        spotifyId:t.id, spotifyUrl:t.external_urls?.spotify || `https://open.spotify.com/track/${t.id}`
      };
      try { // borrow a 30s preview from iTunes when the names match
        const m = (await itunesSearch(`${t.name} ${t.artists?.[0]?.name || ""}`, 1))[0];
        if (m && songKey(m) === keyOf(t)) Object.assign(base, { previewUrl:m.previewUrl, appleUrl:m.appleUrl, genre:m.genre, artwork: base.artwork || m.artwork });
      } catch {}
      try {
        await setDoc(doc(db,"songs","sp_" + t.id), {
          ...base, note:"", tags:[], source:"spotify",
          addedBy:{ uid:S.me.uid, name:S.me.name, photo:S.me.photo },
          createdAt: serverTimestamp(), reactions:{}, ratings:{}, listened:{}, commentCount:0,
          sentTo:[], sends:[], playlist:"added", playlistAt:Date.now()
        });
        imported++;
      } catch {}
    }
    const bits = [];
    if (imported) bits.push(`${imported} new from Spotify`);
    if (marked) bits.push(`${marked} marked in playlist`);
    if (unmarked) bits.push(`${unmarked} no longer in playlist`);
    if (bits.length) toast("Playlist synced: " + bits.join(", "), 4000);
    else if (manual) toast("Playlist is in sync ✓");
  } catch (e) {
    if (manual) toast("Sync failed: " + e.message, 5000);
  } finally { S.syncing = false; }
}

/* ---------- Start ---------- */
if (!configured) $("#setupGate").classList.remove("hidden");
else boot();

/* ---------- PWA ---------- */
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
